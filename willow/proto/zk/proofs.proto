edition = "2023";

package secure_aggregation.willow;

option java_multiple_files = true;
option java_outer_classname = "ProofsProto";

message LinearInnerProductProofProto {
  repeated bytes a = 1;
  bytes delta = 2;
  bytes c = 3;
  bytes r = 4;
}

message RlweRelationProofProto {
  bytes comm_rev = 1;
  bytes comm_wrho = 2;
  bytes comm_y_r = 3;
  bytes comm_y_e = 4;
  bytes comm_y_vw = 5;
  repeated bytes z_r = 6;
  repeated bytes z_e = 7;
  repeated bytes z_vw = 8;
  LinearInnerProductProofProto lip_proof = 9;
}
