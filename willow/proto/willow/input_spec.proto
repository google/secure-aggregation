syntax = "proto3";

package secure_aggregation.willow;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "InputSpecProto";

// This message describes the specification of the input data for the secure
// aggregation protocol. It contains two lists of `InputVectorSpec` messages:
// `metric_vector_specs` for metrics to be aggregated and
// `group_by_vector_specs` for columns used for grouping.
//
// Each `InputVectorSpec` includes:
// -   `vector_name`: The name of the input vector.
// -   `data_type`: The data type of the values in the vector.
// -   `domain_spec`: An optional specification of the domain of the values in
//     the vector, used for validation and encoding.
//
// Examples:
//
// 1.  Specifying a GROUP_BY column for "country":
//     group_by_vector_specs {
//       vector_name: "country"
//       data_type: STRING
//       domain_spec {
//         string_values {
//           values: ["US", "CA", "MX"]
//         }
//       }
//     }
//     This defines a group-by vector named "country" of type STRING, where
//     the allowed values are "US", "CA", and "MX".
//
// 2.  Specifying a METRIC column for "revenue":
//     metric_vector_specs {
//       vector_name: "revenue"
//       data_type: INT64
//       domain_spec {
//         interval {
//           min: 0
//           max: 1000000
//         }
//       }
//     }
//     This defines a metric vector named "revenue" of type INT64, where
//     values are expected to be between 0 and 1,000,000.
//
// 3.  Specifying a GROUP_BY column for "is_active":
//     group_by_vector_specs {
//       vector_name: "is_active"
//       data_type: BOOL
//     }
//     This defines a group-by vector named "is_active" of type BOOL.
message InputSpec {
  // Supported data types for output vectors
  enum DataType {
    DATA_TYPE_UNSPECIFIED = 0;
    INT32 = 1;
    INT64 = 2;
    BOOL = 3;
    FLOAT = 4;
    DOUBLE = 5;
    BYTES = 6;
    STRING = 7;
  }
  // Defines a domain as an interval.
  message Interval {
    // The lower bound of the interval. The interval is inclusive.
    double min = 1;
    // The upper bound of the interval. The interval is inclusive.
    double max = 2;
  }

  message StringValues {
    repeated string values = 1;
  }

  // A domain for timestamps represented in a modular way, yielding a small
  // closed domain instead of an unbounded number of timestamps.
  //
  // Input timestamps t (as strings) are parsed and mapped to a period index in
  // [0, num_periods) using:
  //    period_index = ((t - origin_time) / period_duration) mod num_periods
  //  Stale events (older than lookback_window relative to Now()) or future
  //  events are mapped to a special invalid bucket (index num_periods). During
  //  decoding, timestamps are reconstructed relative to a dynamic anchor_time.
  //
  //  Inputs encoded more than (num_periods * period_duration - lookback_window)
  //  apart might collide, i.e. contain different timestamps mapping to the same
  //  bucket. Shorter lookback windows allow for longer retention before
  //  aggregation and decoding.
  //
  //  Example: inputs from Device 1 and Device 3 should not be decoded together.
  //
  //    <----- num_periods * period_duration ----->
  //  --+------|------|------|------|------|------|------|------|------|--> Time
  //    |  B3  |  B4  |  B5  |  B0  |  B1  |  B2  |  B3  |  B4  |  B5  | Bucket
  //    | Day 1| Day 2| Day 3| Day 4| Day 5| Day 6| Day 7| Day 8| Day 9|  Day
  //    +------+------+------+------+------+------+------+------+------+
  //    ^                                         ^
  //    anchor_time                anchor_time + num_periods * period_duration
  //
  //  Device 1:
  //                 t_1
  //                  v
  //    [=============] (lookback_window = 2 days)
  //
  //  Device 2:
  //                                              t_2
  //                                              v
  //                                [=============]
  //  Device 3:
  //                                                            t_3
  //                                                            v
  //                                              [=============]
  //

  message TimeDomain {
    // The duration of each period.
    google.protobuf.Duration period_duration = 1;
    // The number of periods.
    int32 num_periods = 2;
    // The format string used for parsing and formatting (absl::ParseTime
    // compatible). If empty, RFC 3339 is used.
    string format = 3;
    // The timezone to use if the timestamp string does not contain timezone
    // info (e.g., "America/Los_Angeles", "UTC"). Must be absl::LoadTimeZone
    // compatible, i.e. a valid IANA timezone name. If not set, "UTC" is used.
    // If the timestamp string contains a UTC offset specification (e.g., %z),
    // the timezone offset in the string takes precedence.
    string timezone = 4;
    // The origin time from which the periods are calculated.
    // If not set, the Unix Epoch (1970-01-01T00:00:00Z) is used.
    google.protobuf.Timestamp origin_time = 5;
    // The lookback window defining how far back in time from the encoding
    // time we accept events. Events older than this duration, or
    // events in the future, will be mapped to the invalid bucket.
    // If not set, defaults to `num_periods * period_duration / 2`.
    google.protobuf.Duration lookback_window = 6;
  }

  // A new message type to represent the domain specification.
  message DomainSpec {
    oneof domain_type {
      // Defines a domain as an ordered list of string values.
      StringValues string_values = 1;

      // Defines a domain as an interval of values.
      Interval interval = 2;

      // Defines a domain for timestamps.
      TimeDomain time = 3;
    }
  }

  message InputVectorSpec {
    // The output vector name.
    string vector_name = 1;

    // The data type for each entry in the vector.
    DataType data_type = 2;

    // An field to define the domain of the output vector.
    // This could be used for validation or other logic.
    DomainSpec domain_spec = 3;
  }
  repeated InputVectorSpec metric_vector_specs = 1;
  repeated InputVectorSpec group_by_vector_specs = 2;
}
