syntax = "proto3";

package secure_aggregation.willow;

import "third_party/oak/proto/micro_rpc/options.proto";

option java_multiple_files = true;

// DecryptorService is the service that implements the Willow Decryptor.
service DecryptorService {
  // Generates a new AHE key pair and returns the public key.
  rpc GenerateKey(GenerateKeyRequest) returns (GenerateKeyResponse) {
    option deadline = 60.0;
    option (.oak.micro_rpc.method_id) = 1;
  }

  // Decrypts the content of the given request using the keys maintained in the
  // state.
  rpc Decrypt(DecryptRequest) returns (DecryptResponse) {
    option deadline = 60.0;
    option (.oak.micro_rpc.method_id) = 2;
  }
}

message GenerateKeyRequest {
  // The key ID to use for the generated key. If the key with the given ID
  // already exists, it will be returned instead.
  bytes key_id = 1;
}

message GenerateKeyResponse {
  // The serialized bytes of the public key.
  bytes public_key = 1;
}

message DecryptRequest {
  // The serialized bytes of the message to decrypt.
  bytes decryption_request = 1;
  // The serialized bytes of the public key as returned by GenerateKey.
  bytes public_key = 2 [deprecated = true];
  // The key ID of the public key that was used in the GenerateKey call.
  bytes key_id = 3;
}

message DecryptResponse {
  // The serialized bytes of the message decrypted.
  bytes decryption_response = 1 [ctype = CORD];
}

// Error status.
message Status {
  int32 code = 1;
  string message = 2;
}

// DecryptorRequest and DecryptorResponse combine individual request and
// response messages above, and are used by the replicated implementation of the
// Decryptor.
message DecryptorRequest {
  oneof msg {
    // Creates a new key pair for encrypting messages with asymmetric
    // encryption.
    GenerateKeyRequest generate_key = 1;
    // Decrypts a message encrypted with a generated public key.
    DecryptRequest decrypt = 2;
  }
}

message DecryptorResponse {
  oneof msg {
    // Response for GenerateKeyRequest.
    GenerateKeyResponse generate_key = 1;
    // Response for DecryptRequest.
    DecryptResponse decrypt = 2;
    // Error status shared among requests.
    Status error = 3;
  }
}

// Decryptor configuration - used to configure replicated Decryptor job.
message DecryptorConfig {}
