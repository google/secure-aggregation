syntax = "proto3";

package secure_aggregation.willow;

option java_multiple_files = true;
option java_outer_classname = "SessionEnums";

enum SessionType {
  SESSION_TYPE_UNSPECIFIED = 0;
  GENERATE_KEY = 1;
  DECRYPT_AGGREGATE = 2;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  NOT_STARTED = 1;
  RUNNING = 2;
  SUCCEEDED = 3;
  FAILED = 4;
  CANCELLED = 5;
}
