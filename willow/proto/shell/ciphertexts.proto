syntax = "proto3";

package secure_aggregation.willow;

import "shell_encryption/rns/rns_serialization.proto";

option java_multiple_files = true;
option java_outer_classname = "CiphertextsProto";

message ShellAheSecretKeyShare {
  rlwe.SerializedRnsPolynomial poly = 1;
}

message ShellAhePublicKeyShare {
  rlwe.SerializedRnsPolynomial poly = 1;
}

message ShellAhePublicKey {
  rlwe.SerializedRnsPolynomial poly = 1;
}

message ShellAhePartialDecryption {
  repeated rlwe.SerializedRnsPolynomial poly = 1;
}

message ShellAhePartialDecCiphertext {
  repeated rlwe.SerializedRnsPolynomial poly = 1;
}

message ShellAheRecoverCiphertext {
  repeated rlwe.SerializedRnsPolynomial poly = 1;
}

message ShellAheCiphertext {
  ShellAheRecoverCiphertext component_b = 1;
  ShellAhePartialDecCiphertext component_a = 2;
}

message ShellKaheCiphertext {
  repeated rlwe.SerializedRnsPolynomial poly = 1;
}

message ShellKaheSecretKey {
  rlwe.SerializedRnsPolynomial poly = 1;
}
